
name: Automated Tagging and Release

permissions:
  contents: write

on:
  push:
    branches:
      - master

jobs:
  update-tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.create_tag.outputs.new_tag }}
      update_type: ${{ steps.get_update_type.outputs.update_type }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Get update type from commit message
      id: get_update_type
      run: |
        commit_message="${{ github.event.head_commit.message }}"
        if [[ "$commit_message" == *"#major"* ]]; then
          echo "update_type=major" >> $GITHUB_OUTPUT
        elif [[ "$commit_message" == *"#minor"* ]]; then
          echo "update_type=minor" >> $GITHUB_OUTPUT
        else
          echo "update_type=patch" >> $GITHUB_OUTPUT
        fi

    - name: Get latest tag
      id: get_latest_tag
      run: |
        git fetch --tags
        latest_tag=$(git describe --tags `git rev-list --tags --max-count=1` 2>/dev/null || echo "")
        echo "latest_tag=${latest_tag}" >> $GITHUB_OUTPUT

    - name: Create new tag
      id: create_tag
      run: |
        latest_tag=${{ steps.get_latest_tag.outputs.latest_tag }}
        update_type=${{ steps.get_update_type.outputs.update_type }}
        
        if [ -z "$latest_tag" ]; then
          new_tag="v0.1.0"
        else
          IFS='.' read -ra VERSION <<< "${latest_tag#v}"
          major=${VERSION[0]}
          minor=${VERSION[1]}
          patch=${VERSION[2]}
          
          case $update_type in
            major)
              major=$((major+1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor+1))
              patch=0
              ;;
            patch)
              patch=$((patch+1))
              ;;
          esac
          
          new_tag="v$major.$minor.$patch"
        fi
        
        echo "new_tag=${new_tag}" >> $GITHUB_OUTPUT
        git config user.name github-actions
        git config user.email github-actions@github.com
        git tag $new_tag
        git push origin $new_tag

  # CHANGELOG.md automation: every master push (PR merge) refreshes the
  # [Unreleased] section from all commits since the last GitHub Release; a
  # '#release' push instead promotes that range to a version section. Ranges
  # are bounded by real releases, never by the per-push tags minted above.
  # The bot commits carry [skip ci], so they trigger neither tags nor CI.
  changelog:
    if: ${{ !contains(github.event.head_commit.message, '#release') }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Render unreleased changes
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        pip install --quiet git-cliff
        last=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
        git-cliff --config cliff.toml --strip all "${last}..HEAD" -o body.md
        python scripts/update_changelog.py unreleased --body body.md
        rm body.md

    - name: Commit CHANGELOG.md
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        branch: master
        commit_message: "chore(changelog): refresh unreleased [skip ci]"
        file_pattern: CHANGELOG.md

  changelog-release:
    needs: [update-tag]
    if: contains(github.event.head_commit.message, '#release')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Promote unreleased to ${{ needs.update-tag.outputs.new_tag }}
      env:
        GH_TOKEN: ${{ github.token }}
        NEW_TAG: ${{ needs.update-tag.outputs.new_tag }}
      run: |
        pip install --quiet git-cliff
        last=$(gh release list --json tagName --jq '.[].tagName' | grep -vx "$NEW_TAG" | head -1)
        git-cliff --config cliff.toml --strip all "${last}..HEAD" -o body.md
        python scripts/update_changelog.py release --version "$NEW_TAG" \
          --date "$(date -u +%F)" --body body.md
        rm body.md

    - name: Commit CHANGELOG.md
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        branch: master
        commit_message: "chore(changelog): release ${{ needs.update-tag.outputs.new_tag }} [skip ci]"
        file_pattern: CHANGELOG.md

  release:
    needs: [update-tag]
    if: contains(github.event.head_commit.message, '#release')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install build twine wheel

    - name: Install package for testing
      run: pip install -e ".[dev]"

    - name: Run tests
      run: pytest tests/

    - name: Build package
      run: |
        python -m build --sdist --wheel
        python -m twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        username: __token__
        password: ${{ secrets.PYPI_API_TOKEN_EBM }}
        verbose: true

    - name: Create GitHub Release
      uses: actions/github-script@v7
      env:
        RELEASE_TAG: ${{ needs.update-tag.outputs.new_tag }}
      with:
        script: |
          const response = await github.rest.repos.createRelease({
            draft: false,
            generate_release_notes: true,
            name: process.env.RELEASE_TAG,
            owner: context.repo.owner,
            prerelease: false,
            repo: context.repo.repo,
            tag_name: process.env.RELEASE_TAG,
          });
          core.setOutput('upload_url', response.data.upload_url);